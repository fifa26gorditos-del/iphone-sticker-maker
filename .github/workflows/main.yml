name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q StickerMakerIOS.zip -d src
      - run: brew install xcodegen
      - name: Build
        working-directory: src
        run: |
          xcodegen generate
          xcodebuild -project StickerMaker.xcodeproj -scheme StickerMaker -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/StickerMaker.app Payload/
          zip -qr StickerMaker.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: StickerMaker-ipa
          path: src/StickerMaker.ipa
